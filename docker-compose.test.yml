services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: statusdb
      POSTGRES_USER: statususer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statususer -d statusdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DB_HOST: test-db
      DB_NAME: statusdb
      DB_USER: statususer
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: /app
