name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-test-password
      GRAFANA_ADMIN_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run integration tests
        run: docker compose -f docker-compose.test.yml run --rm --build test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ~/status-app
            git pull origin main
            docker compose up -d --build
  smoke_test:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Production smoke test
        run: |
          response=$(curl -fsS https://vm01-linux.duckdns.org/health/ready)
          echo "$response"
          echo "$response" | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'
